<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="heading">Number Guessing Game</h1>

    <div id="form">
        <form>
            <p class="stat">Guess numbers between <b>1 to 100</b></p>
            <p class="stat">You have <b>10 attempts</b> to guess the right number</p>

            <label for="guessField">
                <h2>Enter your guess:</h2>
            </label>
            <input type="number" min="1" max="100" id="guessField" required>
            <br><br>

            <input type="submit" value="Submit Guess" id="guessSubmit">
        </form>

        <div id="resultParas">
            <p><b>Previous guesses:</b> <span id="guesses"></span></p>
            <p><b>Guesses Remaining:</b> <span id="lastResult">10</span></p>
            <p class="lowOrHigh"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
